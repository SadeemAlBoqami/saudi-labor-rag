services:
  llama-service:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda

    runtime: nvidia

    dns:
      - 1.1.1.1
      - 8.8.8.8

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    command:
      - -hf
      - ggml-org/gemma-3-4b-it-GGUF:Q4_K_M
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "4096"
      - --parallel
      - "1"
      - --n-gpu-layers
      - "99"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10m

  rag-service:
    build:
      context: .
      dockerfile: Dockerfile

    dns:
      - 1.1.1.1
      - 8.8.8.8

    environment:
      LLM_BASE_URL: http://llama-service:8080

    depends_on:
      llama-service:
        condition: service_healthy

    ports:
      - "8000:8000"