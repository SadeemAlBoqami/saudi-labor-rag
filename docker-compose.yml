services:
  llama-service:
    image: sadeemalboqami/saudi-labor-llama:cuda124

    runtime: nvidia

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    command:
      - -hf
      - ggml-org/gemma-3-4b-it-GGUF:Q4_K_M
      - --host
      - 0.0.0.0
      - --port
      - "8080"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  rag-service:
    image: sadeemalboqami/saudi-labor-rag:server-cuda124

    runtime: nvidia

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      LLM_BASE_URL: http://llama-service:8080

    depends_on:
      llama-service:
        condition: service_healthy

    volumes:
      - ./benchmarks:/app/benchmarks

    command: python3 -m evaluation.evaluate_rag